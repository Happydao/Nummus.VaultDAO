name: Monitor ZEC Vault + Swap Events

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/monitor.sh
      - .github/workflows/wallet-monitor.yml

permissions:
  contents: write

concurrency:
  group: wallet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq bc curl
      - name: Fetch ZEC balances, prices, and transactions
        run: bash scripts/monitor.sh

      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "Update: ZEC vault balances, tx, prices (hourly)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Trigger NUMMUS NAV snapshot
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.NAV_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/Happydao/nummus-nav-dashboard/actions/workflows/deploy-pages.yml/dispatches \
            -f ref=main
