name: Monitor Vault + Swap Events

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora (UTC)
  workflow_dispatch:

# Serve a poter pushare i JSON aggiornati
permissions:
  contents: write

# Evita run sovrapposti se uno job impiega più di 1h
concurrency:
  group: monitor-vault-swap-events
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch balances, prices, and transactions (robust)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          # ====== CONFIG ======
          WALLET1="AoXJQjDcK7C28ecdNVQjGjXW8V6nxR7NY7rBFhdhUc5B"
          WALLET2="HtT3yMsAavLQYmd6VSbXSdbAefyZUrrFeEPoTPivde3s"

          MINT_TBTC="6DNSN2BJsaPFdFFc1zP37kkeNe4Usc1Sqkzr9C9vPWcU"
          MINT_BUMPER="5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk"
          MINT_SOL="So11111111111111111111111111111111111111112"

          API_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"

          # ====== HELPERS ======
          get_balance() {
            local WALLET=$1
            local MINT=$2

            local OUT
            OUT=$(curl -sS --retry 3 --retry-delay 2 --max-time 25 -X POST "$API_RPC" \
              -H "Content-Type: application/json" \
              -d '{
                "jsonrpc":"2.0","id":"1","method":"getAssetsByOwner",
                "params":{"ownerAddress":"'"$WALLET"'","page":1,"limit":1000,
                "options":{"showFungible":true,"showZeroBalance":false}}
              }' || true)

            if ! jq -e . >/dev/null 2>&1 <<<"$OUT"; then
              echo "0.00000000"; return
            fi

            local BAL_DEC
            BAL_DEC=$(echo "$OUT" | jq -r --arg M "$MINT" '
              (.result.items // [])[]
              | select(.id == $M)
              | {bal: (.token_info.balance|tostring), dec: (.token_info.decimals|tostring)}
              | "\(.bal) \(.dec)"
            ' | head -n1)

            if [ -n "$BAL_DEC" ]; then
              awk '{ if ($1 && $2) printf "%.8f", $1 / (10 ^ $2); else print "0.00000000" }' <<<"$BAL_DEC"
            else
              echo "0.00000000"
            fi
          }

          fetch_page() {
            local URL=$1
            local RES
            RES=$(curl -sS --retry 3 --retry-delay 2 --max-time 25 "$URL" || true)
            if jq -e 'type=="array"' >/dev/null 2>&1 <<<"$RES"; then
              echo "$RES"
            else
              echo "[]"
            fi
          }

          fetch_transactions() {
            local WALLET=$1
            local LAST=""
            local ALL="[]"
            for i in {1..8}; do  # fino a ~800 tx
              local URL="https://api.helius.xyz/v0/addresses/$WALLET/transactions?api-key=$HELIUS_API_KEY&limit=100"
              [ -n "$LAST" ] && URL="$URL&before=$LAST"
              local PAGE
              PAGE=$(fetch_page "$URL")
              # aggiungi solo se è un array (evita errori "array and object cannot be added")
              ALL=$(jq -s '[.[] | select(type=="array")] | add // []' <<<"$ALL $PAGE")
              LAST=$(jq -r '.[-1].signature // empty' <<<"$PAGE")
              [ -z "$LAST" ] && break
            done
            echo "$ALL"
          }

          parse_transfers() {
            local DATA="$1" WALLET="$2" MINT="$3"
            jq -c --arg M "$MINT" --arg W "$WALLET" '
              [ .[]? as $tx
                | ($tx.tokenTransfers // [])[]
                | select(.mint == $M and ((.toUserAccount // "") == $W or (.fromUserAccount // "") == $W))
                | {
                    signature: $tx.signature,
                    timestamp: ((($tx.timestamp // 0) | tonumber) | todateiso8601),
                    direction: ( if ((.toUserAccount // "") == $W) then "in" else "out" end ),
                    amount: (.tokenAmount | tonumber)
                  }
              ]
              | unique_by(.signature)
              | sort_by(.timestamp) | reverse
              | .[:30]
            ' <<<"$DATA" 2>/dev/null || echo '[]'
          }

          # ====== BALANCES ======
          TBTC_BAL_W1=$(get_balance "$WALLET1" "$MINT_TBTC")
          TBTC_BAL_W2=$(get_balance "$WALLET2" "$MINT_TBTC")
          BUMPER_BAL_W2=$(get_balance "$WALLET2" "$MINT_BUMPER")

          # ====== TX (merge cross-wallet per ENTRAMBI) ======
          XFERS_W1=$(fetch_transactions "$WALLET1")
          XFERS_W2=$(fetch_transactions "$WALLET2")

          XFERS_W1_DEDUP=$(echo "$XFERS_W1" | jq 'unique_by(.signature)')
          XFERS_W2_DEDUP=$(echo "$XFERS_W2" | jq 'unique_by(.signature)')

          MERGED_ALL=$(jq -s '[.[] | select(type=="array")] | add // [] | unique_by(.signature)' \
            <<<"$XFERS_W1_DEDUP $XFERS_W2_DEDUP")

          # debug quick look
          echo "$MERGED_ALL" | jq '.[0:10] | map({signature, timestamp, tokenTransfers})' > data/debug_wallet1_transfers.json
          echo "$MERGED_ALL" | jq '.[0:10] | map({signature, timestamp, tokenTransfers})' > data/debug_wallet2_transfers.json
          echo "$MERGED_ALL" > data/raw_wallets_merged.json

          LAST_TBTC_W1_JSON=$(parse_transfers "$MERGED_ALL" "$WALLET1" "$MINT_TBTC")
          LAST_TBTC_W2_JSON=$(parse_transfers "$MERGED_ALL" "$WALLET2" "$MINT_TBTC")

          # ====== PRICES ======
          PRICE_TBTC=$(curl -sS --retry 3 --retry-delay 2 "https://api.coingecko.com/api/v3/simple/price?ids=tbtc&vs_currencies=usd" | jq -r '.tbtc.usd // 0')
          PRICE_NUMMUS=$(curl -sS --retry 3 --retry-delay 2 "https://api.coingecko.com/api/v3/simple/price?ids=nummus-aeternitas&vs_currencies=usd" | jq -r '."nummus-aeternitas".usd // 0')
          PRICE_SOL=$(curl -sS --retry 3 --retry-delay 2 "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd" | jq -r '.solana.usd // 0')

          # NOTE: amount=1_000_000 assume BUMPER con 6 decimali => 1.0 BUMPER.
          QUOTE_JSON=$(curl -sS --retry 3 --retry-delay 2 "https://quote-api.jup.ag/v6/quote?inputMint=$MINT_BUMPER&outputMint=$MINT_SOL&amount=1000000&slippage=1" || echo '{}')
          OUT_AMOUNT=$(echo "$QUOTE_JSON" | jq -r '.outAmount // "0"')

          SOL_PER_BUMPER=$(awk "BEGIN {printf \"%.12f\", $OUT_AMOUNT / 1000000000}")   # lamports -> SOL
          PRICE_BUMPER=$(awk "BEGIN {printf \"%.8f\", $SOL_PER_BUMPER * $PRICE_SOL}")

          VALUE_W1=$(awk "BEGIN {printf \"%.2f\", $TBTC_BAL_W1 * $PRICE_TBTC}")
          VALUE_W2=$(awk "BEGIN {printf \"%.2f\", $TBTC_BAL_W2 * $PRICE_TBTC}")
          VALUE_BUMPER=$(awk "BEGIN {printf \"%.2f\", $BUMPER_BAL_W2 * $PRICE_BUMPER}")
          TOTAL_USD_VAULT=$(awk "BEGIN {printf \"%.2f\", $VALUE_W2 + $VALUE_BUMPER}")

          # ====== OUTPUT JSON (safe fromjson) ======
          jq -n \
            --arg tbtc1 "$TBTC_BAL_W1" \
            --arg tbtc2 "$TBTC_BAL_W2" \
            --arg val1 "$VALUE_W1" \
            --arg val2 "$VALUE_W2" \
            --arg last1 "$LAST_TBTC_W1_JSON" \
            --arg last2 "$LAST_TBTC_W2_JSON" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              wallet_1: {
                tbtc_balance: ($tbtc1 | tonumber),
                tbtc_usd_value: ($val1 | tonumber),
                last_tbtc_transfers: ($last1 | try fromjson catch [])
              },
              vault_wallet_2: {
                tbtc_balance: ($tbtc2 | tonumber),
                tbtc_usd_value: ($val2 | tonumber),
                last_tbtc_transfers: ($last2 | try fromjson catch [])
              },
              timestamp: $time
            }' > data/status.json

          jq -n \
            --arg price "$PRICE_TBTC" \
            --arg nummus "$PRICE_NUMMUS" \
            --arg bumper_price "$PRICE_BUMPER" \
            --arg bumper_qty "$BUMPER_BAL_W2" \
            --arg bumper_val "$VALUE_BUMPER" \
            --arg w1_bal "$TBTC_BAL_W1" \
            --arg w1_val "$VALUE_W1" \
            --arg w2_bal "$TBTC_BAL_W2" \
            --arg w2_val "$VALUE_W2" \
            --arg total_vault_usd "$TOTAL_USD_VAULT" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              tbtc_price_usd: ($price | tonumber),
              nummus_price_usd: ($nummus | tonumber),
              bumper: {
                mint: "'"$MINT_BUMPER"'",
                price_usd: ($bumper_price | tonumber),
                quantity: ($bumper_qty | tonumber),
                total_value_usd: ($bumper_val | tonumber)
              },
              wallet_1: { tbtc_balance: ($w1_bal | tonumber), tbtc_usd_value: ($w1_val | tonumber) },
              wallet_2: { tbtc_balance: ($w2_bal | tonumber), tbtc_usd_value: ($w2_val | tonumber) },
              total_usd_value: ($total_vault_usd | tonumber),
              timestamp: $time
            }' > data/prices.json

      - name: Run extended calculations (prices2.json)
        shell: bash
        run: |
          if [ -x scripts/process_prices2.sh ]; then
            ./scripts/process_prices2.sh
          else
            echo "scripts/process_prices2.sh not found or not executable — skipping."
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if ! git diff --quiet; then
            git add data/*.json
            git commit -m "Update: vault balances, tx, prices (hourly)"
            git push
          else
            echo "No changes."
          fi
